services:
  pb:
    # image: alpine:latest
    build: .
    entrypoint: /app/pb/entrypoint.sh
    command: "/app/pb/pocketbase serve --dev --http 0.0.0.0:8090 --publicDir ../sk/build"
    user: ${UID}:${GID}
    expose:
      - 8090
    working_dir: /app/pb
    environment:
      - RELEASE=${RELEASE:-standard} # use "custom" for main.go build, "standard" for downloaded binary
      - PB_VERSION=0.38.0
      - PB_ARCH=linux_amd64
      - HOME=/app/pb
      - AUDITLOG=${AUDITLOG}
    volumes:
      - ${PWD}/pb:/app/pb
      - ${PWD}/sk:/app/sk
      - ${HOME}/go/pkg:/go/pkg
  sk:
    image: oven/bun:1-alpine
    user: ${UID}:${GID}
    # sveltekit build
    command: sh -c "bun install && bun run build"
    volumes:
      - ${PWD}/sk:/app/sk
      - ${PWD}/pb:/app/pb
    environment:
      - HOME=/app/sk
    working_dir: /app/sk
